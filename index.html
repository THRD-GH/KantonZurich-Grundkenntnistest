    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Zürich Grundkenntnistest — Practice Quiz",
      "url": "https://zurichtest.ch/",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web browser",
      "browserRequirements": "Requires JavaScript",
      "inLanguage": ["de","en","fr","it","pt","es","sq","hr","tr","ta","ti","ar"],
      "isAccessibleForFree": true,
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CHF" },
      "description": "Free, unofficial study app for the Canton of Zürich Grundkenntnistest (basic-knowledge test for Swiss naturalisation): all 350 official questions with explanations, a timed mock exam, spaced-repetition review, audio read-out and translations in 12 languages."
    }

    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#D52B1E" />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // Apply the saved colour theme before first paint (no flash). React keeps it in sync afterwards.
      (function () {
        try {
          var t = localStorage.getItem('gkt_theme_v1');
          if (t !== 'light' && t !== 'dark' && t !== 'system' && t !== 'contrast') {
            t = localStorage.getItem('gkt_contrast_v1') === 'high' ? 'contrast' : 'system';
          }
          var de = document.documentElement;
          if (t === 'contrast') { de.setAttribute('data-contrast', 'high'); de.setAttribute('data-theme', 'light'); }
          else {
            var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            de.setAttribute('data-theme', dark ? 'dark' : 'light');
          }
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:640px;margin:2rem auto;padding:0 1rem;font-family:system-ui,-apple-system,sans-serif;line-height:1.55;color:#111">
        <h1>Zürich Grundkenntnistest — free practice quiz</h1>
        <p>A free, unofficial study app for the Canton of Zürich <strong>Grundkenntnistest</strong> — the basic-knowledge test on Switzerland, the canton and the municipality that applicants must pass for ordinary naturalisation. Practise all 350 official questions with instant feedback, short explanations, a timed mock exam, spaced-repetition review, audio read-out and translations in 12 languages.</p>
        <p>This app needs JavaScript to run. Please enable it, or see the official Canton of Zürich information here:
          <a href="https://www.zh.ch/de/migration-integration/einbuergerung/grundkenntnistest.html">zh.ch — Grundkenntnistest</a>.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
